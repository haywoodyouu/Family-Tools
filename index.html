<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Our schedule</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Schedule">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3F7FB; --card:#FFFFFF; --ink:#24304A; --soft:#5E6B85; --line:#DCE3EC;
  --h:#FFD9C7; --h-ink:#7A2E12; --h-strong:#E5784A;
  --g:#CDEFE3; --g-ink:#0D5340; --g-strong:#2EA57E;
  --sel:#24304A; --sel-ink:#FFFFFF;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#141A26; --card:#1D2536; --ink:#E8EDF7; --soft:#A3AECA; --line:#2E3A52;
    --h:#5A3020; --h-ink:#FFD9C7; --h-strong:#F0956D;
    --g:#1C4A3D; --g-ink:#CDEFE3; --g-strong:#5DCAA5;
    --sel:#E8EDF7; --sel-ink:#141A26;
  }
}
:root[data-theme="dark"]{
  --bg:#141A26; --card:#1D2536; --ink:#E8EDF7; --soft:#A3AECA; --line:#2E3A52;
  --h:#5A3020; --h-ink:#FFD9C7; --h-strong:#F0956D;
  --g:#1C4A3D; --g-ink:#CDEFE3; --g-strong:#5DCAA5;
  --sel:#E8EDF7; --sel-ink:#141A26;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Nunito,system-ui,-apple-system,"Segoe UI",sans-serif;font-size:17px;line-height:1.45}
button,a{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,a:focus-visible{outline:3px solid var(--sel);outline-offset:2px}
.wrap{max-width:640px;margin:0 auto;padding:16px 16px 48px}
h1,h2,.big{font-family:Fredoka,Nunito,system-ui,sans-serif;font-weight:600}
h2{font-size:22px;margin:22px 0 10px}
.muted{color:var(--soft)}.small{font-size:14px}
.tabs{display:flex;gap:6px;margin:4px 0 14px}
.tab{border:2px solid var(--line);background:var(--card);border-radius:999px;padding:8px 16px;font-weight:700}
.tab[aria-selected="true"]{background:var(--sel);color:var(--sel-ink);border-color:var(--sel)}
.tonight{border-radius:28px;padding:26px 22px;text-align:center}
.tonight.H{background:var(--h);color:var(--h-ink)}.tonight.G{background:var(--g);color:var(--g-ink)}
.tonight .e{font-size:64px;line-height:1}
.tonight .big{font-size:32px;margin:8px 0 2px}
.tonight p{margin:6px 0 0;font-size:18px}
.visit{margin-top:12px;background:var(--card);border-radius:18px;padding:14px 16px;border:1px solid var(--line);font-weight:700}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;margin-top:10px}
.wd{border-radius:14px;padding:8px 2px;text-align:center;font-size:13px;font-weight:700}
.wd .n{font-size:20px;font-family:Fredoka,Nunito,sans-serif}
.wd.H{background:var(--h);color:var(--h-ink)}.wd.G{background:var(--g);color:var(--g-ink)}
.wd.today{outline:3px solid var(--sel);outline-offset:1px}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:14px;color:var(--soft);margin:8px 0}
.sw{display:inline-block;width:14px;height:14px;border-radius:4px;vertical-align:-2px;margin-right:6px}
.sw.H{background:var(--h-strong)}.sw.G{background:var(--g-strong)}
.mhead{display:flex;justify-content:space-between;align-items:center;margin:8px 0}
.mhead button{border:2px solid var(--line);background:var(--card);border-radius:12px;width:44px;height:40px;font-size:20px;font-weight:800}
.mhead b{font-family:Fredoka,Nunito,sans-serif;font-size:21px;font-weight:600}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.dh{font-size:12px;color:var(--soft);text-align:center;font-weight:700}
.c{min-height:58px;border-radius:10px;padding:4px 5px;font-size:13px;font-weight:700;border:1px solid var(--line);background:var(--card)}
.c.H{background:var(--h);color:var(--h-ink);border-color:transparent}.c.G{background:var(--g);color:var(--g-ink);border-color:transparent}
.c.today{outline:3px solid var(--sel);outline-offset:1px}
.c small{display:block;font-size:11px;font-weight:600;line-height:1.2;margin-top:2px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 16px;margin:12px 0}
.panel h3{margin:0 0 6px;font-size:17px}
.panel ul{margin:6px 0 0;padding-left:20px}
.btn{display:inline-block;border:2px solid var(--sel);background:var(--sel);color:var(--sel-ink);border-radius:14px;padding:10px 16px;font-weight:700;text-decoration:none}
code{word-break:break-all;font-size:13px}
</style>
</head>
<body>
<div class="wrap">
  <div class="tabs" role="tablist">
    <button class="tab" role="tab" data-tab="kids" aria-selected="true">Tonight</button>
    <button class="tab" role="tab" data-tab="cal" aria-selected="false">Calendar</button>
    <button class="tab" role="tab" data-tab="plan" aria-selected="false">The plan</button>
  </div>
  <div id="view"></div>
</div>
<script>
/* ===== Schedule rules: edit here ===== */
const HOMES={H:{name:"Haywood home",emoji:"🏡"},G:{name:"Goodwin home",emoji:"🏠"}};
const START=new Date(2026,10,16), P2=new Date(2026,11,14), P3=new Date(2027,0,18), P4=new Date(2027,1,15);
/* Exceptions: "YYYY-MM-DD": "H" or "G" sets that night's home (for holidays). */
const OVERRIDES={};

function phase(d){return d<P2?1:d<P3?2:d<P4?3:4}
function key(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function dayInfo(d){
  d=new Date(d.getFullYear(),d.getMonth(),d.getDate());
  if(d<START) return null;
  const w=d.getDay(), p=phase(d); let night="G", visit=null;
  if(p===1){ if(w===6)night="H"; if(w===1||w===4)visit="4:00–7:15pm"; if(w===0)visit="11:00am–7:15pm"; }
  if(p===2){ if(w===6||w===4)night="H"; if(w===1)visit="4:00–7:15pm"; if(w===0)visit="11:00am–7:15pm"; }
  if(p===3){ if(w===3||w===4||w===6)night="H"; if(w===0)visit="11:00am–7:15pm"; }
  if(p===4){ if(w===3||w===4)night="H"; const wk=Math.floor(Math.round((d-P4)/864e5)/7); if((w===5||w===6||w===0)&&wk%2===0)night="H"; }
  if(OVERRIDES[key(d)]) night=OVERRIDES[key(d)];
  return {night,visit,phase:p};
}

const $=s=>document.querySelector(s);
let tab="kids", month=null;
function addDays(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x}

function kidsHTML(){
  const now=new Date(), t=dayInfo(now);
  if(!t){
    const days=Math.ceil((START-new Date(now.getFullYear(),now.getMonth(),now.getDate()))/864e5);
    return `<div class="tonight G"><div class="e">📅</div><div class="big">New schedule soon</div><p>It starts in ${days} day${days===1?"":"s"}, on ${START.toLocaleDateString(undefined,{weekday:"long",month:"long",day:"numeric"})}.</p></div>`;
  }
  const home=HOMES[t.night]; let n=0;
  while(n<60){const x=dayInfo(addDays(now,n+1)); if(!x||x.night!==t.night)break; n++;}
  const other=HOMES[t.night==="H"?"G":"H"];
  const count=n===0?`Tomorrow night: ${other.name}`:`${n+1} sleeps here, then ${other.name}`;
  let visit="";
  if(t.night==="G"&&t.visit) visit=`<div class="visit">${HOMES.H.emoji} Visit at Haywood home today, ${t.visit}</div>`;
  let week=`<div class="week">`;
  for(let i=0;i<7;i++){const d=addDays(now,i),x=dayInfo(d);if(!x){week+=`<div class="wd" style="background:var(--card)"><div>${d.toLocaleDateString(undefined,{weekday:"short"})}</div><div class="n">${d.getDate()}</div></div>`;continue}
    week+=`<div class="wd ${x.night} ${i===0?"today":""}"><div>${d.toLocaleDateString(undefined,{weekday:"short"})}</div><div class="n">${d.getDate()}</div><div>${HOMES[x.night].emoji}</div></div>`}
  week+=`</div>`;
  return `<div class="tonight ${t.night}"><div class="e">${home.emoji}</div><p>Tonight I'm sleeping at</p><div class="big">${home.name}</div><p>${count}</p></div>${visit}
  <h2>This week</h2>${week}
  <div class="legend"><span><span class="sw H"></span>${HOMES.H.name}</span><span><span class="sw G"></span>${HOMES.G.name}</span></div>`;
}

function calHTML(){
  if(!month){const n=new Date();month=n<START?new Date(START.getFullYear(),START.getMonth(),1):new Date(n.getFullYear(),n.getMonth(),1)}
  const y=month.getFullYear(),m=month.getMonth(),first=new Date(y,m,1),days=new Date(y,m+1,0).getDate(),today=key(new Date());
  let g=`<div class="mhead"><button data-m="-1" aria-label="Previous month">‹</button><b>${first.toLocaleDateString(undefined,{month:"long",year:"numeric"})}</b><button data-m="1" aria-label="Next month">›</button></div>
  <div class="legend"><span><span class="sw H"></span>Night at ${HOMES.H.name}</span><span><span class="sw G"></span>Night at ${HOMES.G.name}</span></div><div class="cal">`;
  ["S","M","T","W","T","F","S"].forEach(x=>g+=`<div class="dh">${x}</div>`);
  for(let i=0;i<first.getDay();i++)g+=`<div></div>`;
  for(let d=1;d<=days;d++){const dt=new Date(y,m,d),x=dayInfo(dt);
    if(!x){g+=`<div class="c muted">${d}</div>`;continue}
    const starts=[START,P2,P3,P4].some(s=>+s===+dt)?`<small>Phase ${x.phase} starts</small>`:"";
    const v=x.visit&&x.night==="G"?`<small>Haywood ${x.visit.replace(":00","").replace(":00","")}</small>`:"";
    g+=`<div class="c ${x.night} ${key(dt)===today?"today":""}">${d}${starts}${v}</div>`;}
  return g+`</div>`;
}

function planHTML(){
  const f=d=>d.toLocaleDateString(undefined,{month:"short",day:"numeric",year:"numeric"});
  const feed=new URL("schedule.ics",location.href).href;
  return `<div class="panel"><h3>Phase 1 · starts ${f(START)}</h3>One overnight at Haywood.<ul><li>Monday and Thursday visits, 4:00–7:15pm</li><li>Saturday night overnight</li><li>Sunday until 7:15pm</li></ul></div>
  <div class="panel"><h3>Phase 2 · starts ${f(P2)}</h3>Two overnights at Haywood.<ul><li>Monday visit, 4:00–7:15pm</li><li>Thursday overnight, back to Goodwin Friday at 4pm</li><li>Saturday overnight, Sunday until 7:15pm</li></ul></div>
  <div class="panel"><h3>Phase 3 · starts ${f(P3)}</h3>Three overnights at Haywood. Monday visits end.<ul><li>Wednesday and Thursday overnights, back to Goodwin Friday at 4pm</li><li>Saturday overnight, Sunday until 7:15pm</li></ul></div>
  <div class="panel"><h3>Phase 4 · starts ${f(P4)}</h3>Ongoing schedule.<ul><li>Haywood: every Wednesday and Thursday night</li><li>Haywood every other weekend: Wednesday 4pm through Monday 4pm</li><li>Goodwin: every Monday and Tuesday night, plus the other weekends from Friday at 4pm</li></ul></div>
  <div class="panel"><h3>Handoffs</h3>Weekday handoffs happen at 4pm after school. Holidays and school breaks aren't included yet.</div>
  <div class="panel"><h3>Add to your calendar</h3><p class="small muted">In Google Calendar, use Other calendars → From URL and paste this address. Skylight shows it once it syncs.</p><code>${feed}</code><p><a class="btn" href="schedule.ics" download>Download calendar file</a></p></div>`;
}

function render(){
  $("#view").innerHTML=tab==="kids"?kidsHTML():tab==="cal"?calHTML():planHTML();
  document.querySelectorAll(".tab").forEach(b=>b.setAttribute("aria-selected",b.dataset.tab===tab));
  document.querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>{month=new Date(month.getFullYear(),month.getMonth()+(+b.dataset.m),1);render()});
}
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});
render();
</script>
</body>
</html>
